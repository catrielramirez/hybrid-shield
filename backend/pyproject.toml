[project]
name = "hybrid-shield-backend"
version = "0.1.0"
description = "Core backend y herramientas de desarrollo para Hybrid Shield"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "sqlalchemy==2.0.49",
    "asyncpg==0.31.0",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "psycopg-pool==3.3.1",
    "pgvector==0.3.6",
    "cloud-sql-python-connector==1.20.2",
    "google-cloud-storage>=3.10.0",
    "google-cloud-aiplatform==1.153.1",
    "google-cloud-firestore==2.27.0",
    "google-cloud-bigquery==3.41.0",
    "google-cloud-discoveryengine==0.19.0",
    "google-cloud-logging>=3.15.0",
    "langgraph==1.0.1",
    "langchain-google-cloud-sql-pg>=0.15.0",
    "python-multipart>=0.0.32",
    "langgraph-checkpoint-postgres>=3.0.5",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-benchmark==5.2.3",
    "pytest-codspeed==5.0.2",
    "pytest-recording==0.13.4",
    "pytest-socket==0.7.0",
    "syrupy==4.9.1",
    "vcrpy==7.0.0"
]
